[package]
name = "paperview"
version = "0.5.0"
edition = "2021"
description = "PaperView: a lightweight, fast-starting PDF reader for Linux and Windows"

[dependencies]
# eframe 0.35 defaults to the wgpu backend; we swap it for glow (OpenGL) —
# noticeably smaller binary and faster cold start, which is the whole point.
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence", # remember window geometry + last file between sessions
    "wayland",     # no-ops on Windows, keeps Linux builds working
    "x11",
] }
rfd = "0.17"
# Landing page timestamps (already in the tree via pdfium-render).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
# Library covers are cached on disk as PNG (already in the tree via eframe).
png = "0.18"
# Ebooks: EPUB / CBZ / FBZ are zip archives; their images need decoding.
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
# Win32 window handle for parenting the print dialog (matches eframe/winit).
raw-window-handle = "0.6"
# default features pull in the `image` crate (incl. AVIF codecs) which we don't
# need: PDFium hands us raw RGBA that goes straight into an egui texture.
# `pdfium_latest` selects the newest PDFium API bindings and is required when
# default features are off.
pdfium-render = { version = "0.9", default-features = false, features = [
    "thread_safe",
    "pdfium_latest",
] }

# Backblaze B2 "Cloud" tab: blocking HTTP on worker threads — no async runtime.
# Windows uses Schannel (native-tls): rustls's `ring` needs a C compiler the
# Windows build machine doesn't have. Linux uses rustls with Mozilla's roots
# built in, so the binary doesn't depend on the system's OpenSSL version
# (libssl.so.3 vs .4 differs between distros).
[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

# Wayland drag and drop (tabs between windows, files from file managers):
# winit has none, so PaperView speaks it on winit's own connection. Same
# versions winit already pulls in.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["system"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimised like release, but with the debug-only UI test driver compiled in,
# so performance can be measured on a realistic build.
[profile.perf]
inherits = "release"
debug-assertions = true
