# Builds the Linux download on Ubuntu 22.04 (an older glibc, so the binary runs
# on any distro from about 2022 on) and attaches it to the release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxcb1-dev libgl1-mesa-dev
      - name: PDFium
        run: scripts/fetch-pdfium.sh
      - name: Test
        run: cargo test --release --locked
      - name: Package
        run: scripts/package-linux.sh
      - name: Check the binary's glibc needs
        run: objdump -T dist/PaperView-linux-x86_64/paperview | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: PaperView-linux-x86_64
          path: dist/PaperView-linux-x86_64.tar.gz
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/PaperView-linux-x86_64.tar.gz --clobber
